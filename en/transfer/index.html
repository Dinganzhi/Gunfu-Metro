<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gunfu Metro|Line Transfer Finder</title>
        <link rel="icon" type="image/svg" href="/src/icon.svg" />
        <link rel="stylesheet" type="text/css" href="/src/css/style.css" />
        <link
            rel="stylesheet"
            href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"
        />
        <script src="/src/js/dataInclude.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
        <script src="/src/js/transfer.js" defer></script>
        <script src="/src/js/setting.js" defer></script>
    </head>
    <body class="bg-light">
        <div data-include="/src/html/header-en.html"></div>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <h2>Line Transfer Finder</h2>
                    <h4>Find Transfer between Two Different Lines</h4>
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label for="line1" class="form-label">First Line</label>
                            <select id="line1" class="form-select"></select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="line2" class="form-label">Second Line</label>
                            <select id="line2" class="form-select"></select>
                        </div>
                        <div class="col-12 col-md-auto mt-3">
                            <button id="filterBtn" class="btn btn-primary">Find Transfer</button>
                        </div>
                        <div id="loading" class="col-12 mt-3">Loading Data...</div>
                        <div id="result" class="col-12 mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
