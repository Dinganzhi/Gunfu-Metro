<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>滚服地铁|地铁线路计算</title>
        <link rel="icon" type="image/svg" href="/src/icon.svg" />
        <link rel="stylesheet" type="text/css" href="/src/css/style.css" />
        <link
            rel="stylesheet"
            href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"
        />
        <script src="/src/js/dataInclude.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
        <script src="/src/js/setting.js" defer></script>
        <!--<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileLoad" async defer></script>
    <script src="/src/js/turnstile.js" defer></script>-->
    </head>
    <body>
        <div data-include="/src/html/header-zh-Hans.html"></div>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <h2>地铁线路计算</h2>
                    <h4>查找两站之间的最佳乘坐路径</h4>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="startStation" class="form-label"
                                >起点站</label
                            >
                            <select id="startStation" class="form-select">
                                <option value="">请选择起点</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="endStation" class="form-label"
                                >终点站</label
                            >
                            <select id="endStation" class="form-select">
                                <option value="">请选择终点</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="algorithm" class="form-label"
                                >排序方式</label
                            >
                            <select id="algorithm" class="form-select">
                                <option value="distance">距离最短</option>
                                <option value="transfer">换乘最少</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-check mt-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="allowCrossGroup"
                            checked
                        />
                        <label class="form-check-label" for="allowCrossGroup">
                            允许出站换乘/转乘
                        </label>
                    </div>
                    <button id="calcBtn" class="btn btn-primary mt-3">
                        查询
                    </button>
                    <div id="loading" class="mt-3">正在加载数据……</div>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
        <script src="/src/js/route.js" defer></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                SettingsManager.init(); // 自动读取 Cookie 并应用主题、字体、语言
            });
        </script>
    </body>
</html>
