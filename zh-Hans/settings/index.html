<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>滚服地铁|设置</title>
        <link rel="icon" type="image/svg" href="/src/icon.svg" />
        <link rel="stylesheet" type="text/css" href="/src/css/style.css" />
        <link
            rel="stylesheet"
            href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css"
        />
        <script src="/src/js/dataInclude.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.2/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.min.js"></script>
        <!--<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileLoad" async defer></script>
    <script src="/src/js/turnstile.js" defer></script>-->
        <style>
            /* 可选：保证主题切换时导航栏和文本样式正确 */
            body {
                transition: background-color 0.2s ease;
            }
        </style>
    </head>
    <body class="bg-light">
        <div data-include="/src/html/header-zh-Hans.html"></div>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <h4 class="mb-0">设置</h4>
                    <!-- 色彩模式 -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">色彩模式</label>
                        <select id="themeSelect" class="form-select">
                            <option value="light">浅色模式</option>
                            <option value="dark">深色模式</option>
                            <option value="system">跟随系统</option>
                        </select>
                        <div class="form-text">
                            修改网页的风格，选择“跟随系统”将与设备主题同步。
                        </div>
                    </div>

                    <!-- 字体选择 -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">字体</label>
                        <select id="fontSelect" class="form-select">
                            <option value="default">系统默认字体</option>
                            <option value="mojangles">Mojangles</option>
                            <option value="unifont">GNU Unifont</option>
                        </select>
                        <div class="form-text">切换为网站内置字体，初次加载需要一些时间。</div>
                    </div>

                    <!-- 语言选择 -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">界面语言</label>
                        <select id="langSelect" class="form-select">
                            <option value="zh-Hans">简体中文</option>
                            <option value="zh-Hant">繁體中文</option>
                            <option value="en">English</option>
                        </select>
                        <div class="form-text">保存后，下次访问将跳转到对应语言。</div>
                    </div>

                    <!-- 保存并返回首页按钮 -->
                    <button id="saveAndHomeBtn" class="btn btn-primary w-100">
                        保存并返回首页
                    </button>
                </div>
            </div>
        </div>

        <script src="/src/js/setting.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const themeSelect = document.getElementById("themeSelect");
                const fontSelect = document.getElementById("fontSelect");
                const langSelect = document.getElementById("langSelect");
                const saveBtn = document.getElementById("saveBtn");

                // 回显当前保存的值
                const curTheme = SettingsManager.getCurrentTheme();
                if (curTheme) themeSelect.value = curTheme;
                const curFont = SettingsManager.getCurrentFontKey();
                if (curFont) fontSelect.value = curFont;
                const curLang = SettingsManager.getCurrentLanguage();
                if (curLang) langSelect.value = curLang;

                // 保存并跳转到对应语言首页
                saveBtn.addEventListener("click", () => {
                    const theme = themeSelect.value;
                    const font = fontSelect.value;
                    const lang = langSelect.value;
                    SettingsManager.saveSettings(theme, font, lang, false);
                    let url = "/";
                    if (lang === "zh-Hans") url = "/zh-Hans/";
                    else if (lang === "zh-Hant") url = "/zh-Hant/";
                    else if (lang === "en") url = "/en/";
                    window.location.href = url;
                });
            });
        </script>
    </body>
</html>
